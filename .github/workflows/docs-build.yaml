on:
  workflow_call:

jobs:
  docs-build:
    name: Haddock docs build
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7

      - name: Setup Haskell with Stack
        uses: haskell-actions/setup@v2.12.0
        id: setup
        with:
          enable-stack: true
          stack-version: "latest"
          ghc-version: "9.8.4"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.stack-root }}
          key: docs-${{ hashFiles('stack.yaml') }}
          restore-keys: |
            docs-

      - name: Install dependencies
        run: |
          stack update
          stack build --only-dependencies

      - name: Build Haddock docs
        run: |
          stack haddock lamagraph-core lamagraph-compiler lamagraph-ski
