on:
  workflow_call:

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7

      # The local fourmolu/hlint hooks in .pre-commit-config.yaml need those
      # tools on PATH at the versions pinned in stack.yaml extra-deps. Install
      # them via ghcup (into ~/.local/bin, on PATH) so both the fourmolu
      # wrapper (style-hooks/fourmolu-check.sh) and the hlint hook resolve the
      # pinned versions. The dedicated fourmolu.yaml / hlint.yaml jobs remain
      # the primary style gate; this keeps the pre-commit job consistent with
      # a local commit.
      # The ubuntu-24.04 runner image ships ghcup at /usr/local/.ghcup (on
      # PATH). Use it to install the style tools at the versions pinned in
      # stack.yaml extra-deps (into ~/.ghcup, on PATH), so the fourmolu
      # wrapper and the hlint hook resolve the pinned versions. The dedicated
      # fourmolu.yaml / hlint.yaml jobs remain the primary style gate.
      - name: Install style tools (pinned versions)
        run: |
          export PATH="/usr/local/.ghcup/bin:$HOME/.local/bin:$PATH"
          ghcup install fourmolu 0.18.0.0 --set
          ghcup install hlint 3.10 --set

      - name: Install pre-commit
        run: |
          pipx install pre-commit
          export PATH="$HOME/.local/bin:$PATH"

      - name: Run pre-commit
        run: |
          pre-commit run --all-files
