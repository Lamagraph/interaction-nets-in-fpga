on:
  workflow_call:

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7

      # The local fourmolu/hlint hooks in .pre-commit-config.yaml need those
      # tools on PATH at the versions pinned in stack.yaml extra-deps. Install
      # them via ghcup (into ~/.local/bin, on PATH) so both the fourmolu
      # wrapper (style-hooks/fourmolu-check.sh) and the hlint hook resolve the
      # pinned versions. The dedicated fourmolu.yaml / hlint.yaml jobs remain
      # the primary style gate; this keeps the pre-commit job consistent with
      # a local commit.
      # The local fourmolu/hlint hooks in .pre-commit-config.yaml need those
      # tools on PATH at the versions pinned in stack.yaml extra-deps. Install
      # cabal via the runner image's preinstalled ghcup, then `cabal install`
      # fourmolu-0.18.0.0 and hlint-3.10 (built from Hackage, into ~/.local,
      # on PATH). fourmolu has no prebuilt ghcup binary, so it is built from
      # source. The dedicated fourmolu.yaml / hlint.yaml jobs remain the
      # primary style gate.
      - name: Install style tools (pinned versions)
        run: |
          export PATH="/usr/local/.ghcup/bin:$HOME/.local/bin:$PATH"
          ghcup install ghc 9.8.4 --set
          ghcup install cabal --set
          ghcup install hlint 3.10 --set
          cabal update
          cabal install fourmolu-0.18.0.0


      - name: Install pre-commit
        run: |
          pipx install pre-commit
          export PATH="$HOME/.local/bin:$PATH"

      - name: Run pre-commit
        run: |
          pre-commit run --all-files
