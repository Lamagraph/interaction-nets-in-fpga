on:
  workflow_call:
  # Also runs directly on every pull request, in parallel with the CI
  # chain, so a format failure is visible even if an upstream job in the
  # chain is cancelled or failed before it reaches the fourmolu step.
  pull_request:

jobs:
  hlint:
    name: Fourmolu
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7

      - name: Run fourmolu
        uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.18.0.0"
